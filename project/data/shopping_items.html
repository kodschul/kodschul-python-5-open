<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Wochenangebote – Beispielladen</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    .product { border: 1px solid #ccc; border-radius: 6px; padding: 8px 16px; margin: 8px 0; width: 260px; }
    .product h2 { font-size: 1.1em; margin: 4px 0; }
    .price { font-weight: bold; color: #b00020; margin: 4px 0; }
    .unit { color: #666; margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Wochenangebote</h1>
  <p class="note">Beispielseite für den Python-Kurs, keine echten Preise.</p>

  <div class="product">
    <h2>Orangen</h2>
    <p class="price">0,99 €</p>
    <p class="unit">pro Stück</p>
  </div>
  <div class="product">
    <h2>Mangos</h2>
    <p class="price">2,99 €</p>
    <p class="unit">pro Stück</p>
  </div>
  <div class="product">
    <h2>Limonade</h2>
    <p class="price">1,99 €</p>
    <p class="unit">0,5-l-Flasche</p>
  </div>
  <div class="product">
    <h2>Vollkornbrot</h2>
    <p class="price">3,49 €</p>
    <p class="unit">750 g</p>
  </div>
  <div class="product">
    <h2>Milch</h2>
    <p class="price">1,29 €</p>
    <p class="unit">1 l</p>
  </div>

  <p class="footer">Alle Preise inkl. MwSt. · <a href="impressum.html">Impressum</a></p>
</body>
</html>
